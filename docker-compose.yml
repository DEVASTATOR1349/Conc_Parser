# ======================================================
# Марк1 — Полностью самодостаточный сервис
# Никаких зависимостей от apify-parser или других контейнеров
# ======================================================


services:
  mark1:
    build: .
    container_name: mark1-parser
    restart: unless-stopped
    ports:
      - "18888:8888"
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
    volumes:
      - ./logs:/app/logs
      # Если используешь файл сервисного аккаунта (не JSON-строкой)
      # - ./service_account.json:/app/service_account.json:ro
